[workspace]
resolver = "2"
members = ["crates/oci-builder"]

[workspace.package]
version = "0.1.4"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/geoffsee/oci-builder"
homepage = "https://github.com/geoffsee/oci-builder"
rust-version = "1.85"

# Keep this version equal to workspace.package.version. cargo publish
# turns the path dependency into this crates.io requirement.
[workspace.dependencies]
buildah-ffi = { path = "crates/buildah-ffi", version = "0.1.4" }
rob-proto = { path = "crates/rob-proto", version = "0.1.4" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
