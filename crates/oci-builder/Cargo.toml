[package]
name = "oci-builder"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Embed Buildah in Rust and CLI for building and pushing OCI images"
readme = "README.md"

[lib]
name = "oci_builder"
path = "src/lib.rs"

[[bin]]
name = "oci-builder"
path = "src/main.rs"

[features]
default = ["vm", "default-policy"]
# Run the engine on macOS inside an Apple Virtualization Linux guest that is
# embedded in the binary. Every dependency it enables is macOS-only, so other
# platforms build nothing extra. macOS without it links the unsupported stub.
vm = ["oci-util/vm", "dep:dispatch2", "dep:objc2", "dep:objc2-virtualization"]
# When Config.signature_policy is unset, materialize the containers-common
# default policy (reject, docker localhost, docker-daemon). Without this
# feature an unset policy fails closed.
default-policy = []

[dependencies]
clap = { version = "4", features = ["derive"] }
base64 = "0.23.1"
oci-util = { path = "../oci-util", version = "0.1.11", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ureq = { version = "3.2.0", default-features = true }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
libc = "0.2"

# Product Guest still holds VZ handles; shared boot lives in oci-util.
[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = { version = "0.3", optional = true }
objc2 = { version = "0.6", optional = true }
objc2-virtualization = { optional = true, version = "0.3.2", default-features = false, features = [
    "std",
    "VZVirtualMachine",
] }

[build-dependencies]
cc = "1"

# Build-dependency cfgs match the build host, which is macOS when embedding the guest.
[target.'cfg(target_os = "macos")'.build-dependencies]
oci-util = { path = "../oci-util", version = "0.1.11", default-features = false, features = ["guest-embed"] }
