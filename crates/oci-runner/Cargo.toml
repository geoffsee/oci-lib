[package]
name = "oci-runner"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "A tiny foreground libcontainer runtime and CLI"
readme = "README.md"

[lib]
name = "oci_runner"
path = "src/lib.rs"

[[bin]]
name = "oci-runner"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
dispatch2 = "0.3"
objc2-foundation = { version = "0.3", features = [
    "NSArray",
    "NSError",
    "NSFileHandle",
    "NSString",
    "NSURL",
] }
objc2-virtualization = { version = "0.3.2", default-features = false, features = [
    "std",
    "block2",
    "dispatch2",
    "VZBootLoader",
    "VZLinuxBootLoader",
    "VZVirtualMachine",
    "VZVirtualMachineConfiguration",
    "VZGenericPlatformConfiguration",
    "VZGenericMachineIdentifier",
    "VZPlatformConfiguration",
    "VZVirtioFileSystemDeviceConfiguration",
    "VZDirectoryShare",
    "VZDirectorySharingDeviceConfiguration",
    "VZSharedDirectory",
    "VZSingleDirectoryShare",
    "VZVirtioSocketDevice",
    "VZVirtioSocketDeviceConfiguration",
    "VZVirtioSocketConnection",
    "VZSocketDevice",
    "VZSocketDeviceConfiguration",
    "VZNATNetworkDeviceAttachment",
    "VZNetworkDeviceAttachment",
    "VZNetworkDeviceConfiguration",
    "VZVirtioNetworkDeviceConfiguration",
    "VZVirtioEntropyDeviceConfiguration",
    "VZEntropyDeviceConfiguration",
    "VZSerialPortConfiguration",
    "VZSerialPortAttachment",
    "VZFileHandleSerialPortAttachment",
    "VZVirtioConsoleDeviceSerialPortConfiguration",
] }

[build-dependencies]
cc = "1"
