[package]
name = "oci-runner"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "A tiny foreground libcontainer runtime and CLI"
readme = "README.md"

[lib]
name = "oci_runner"
path = "src/lib.rs"

[[bin]]
name = "oci-runner"
path = "src/main.rs"

[features]
default = ["vm"]
# Run the engine on macOS inside an Apple Virtualization Linux guest that is
# embedded in the binary. Every dependency it enables is macOS-only, so other
# platforms build nothing extra. macOS without it links the unsupported stub.
vm = ["dep:oci-util", "oci-util/vm", "dep:dispatch2", "dep:objc2", "dep:objc2-virtualization"]

[dependencies]
clap = { version = "4", features = ["derive"] }
oci-util = { path = "../oci-util", version = "0.1.11", default-features = false, optional = true }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
libc = "0.2"

# Product Guest still holds VZ handles; shared boot lives in oci-util.
[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = { version = "0.3", optional = true }
objc2 = { version = "0.6", optional = true }
objc2-virtualization = { optional = true, version = "0.3.2", default-features = false, features = [
    "std",
    "VZVirtualMachine",
] }

[build-dependencies]
cc = "1"

# Build-dependency cfgs match the build host, which is macOS when embedding the guest.
[target.'cfg(target_os = "macos")'.build-dependencies]
oci-util = { path = "../oci-util", version = "0.1.11", default-features = false, features = ["guest-embed"], optional = true }
