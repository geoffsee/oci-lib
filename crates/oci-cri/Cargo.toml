[package]
name = "oci-cri"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Reusable CRI v1 runtime library backed by libcontainer"
readme = "README.md"

[lib]
name = "oci_cri"
path = "src/lib.rs"

[[bin]]
name = "oci-cri"
path = "src/main.rs"

[features]
default = []
# In-process fake engine used by the integration tests. Not for production.
test-support = []

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
prost = "0.14"
tonic = "0.14"
tonic-prost = "0.14"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "process", "signal", "fs"] }
futures-core = "0.3"
tokio-stream = { version = "0.1", features = ["sync", "net"] }
futures-util = "0.3"
base64 = "0.23.1"
sha1 = "0.10"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
libc = "0.2"

[build-dependencies]
cc = "1"
tonic-prost-build = "0.14"
protoc-bin-vendored = "3"

[dev-dependencies]
oci-cri = { path = ".", default-features = false, features = ["test-support"] }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http = "1"
hyper-util = { version = "0.1", features = ["tokio"] }
