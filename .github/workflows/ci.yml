name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - feat/*
      - chore/*
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: fmt, clippy, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: false
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-deps-${{ hashFiles('**/Cargo.lock', '**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-deps-
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc pkg-config libseccomp-dev uidmap
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked --lib --bins --examples
      - run: cargo test --workspace --locked --doc

  linux-rootful:
    name: rootful build and push
    runs-on: ubuntu-latest
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: false
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-deps-${{ hashFiles('**/Cargo.lock', '**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-deps-
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc pkg-config libseccomp-dev uidmap curl
      - name: Wait for the registry
        run: |
          for _ in $(seq 1 30); do
            curl -sf http://localhost:5000/v2/ && exit 0
            sleep 1
          done
          echo "registry did not become ready" >&2
          exit 1
      - name: Build the integration test
        run: cargo test -p oci-builder --test build_image --locked --no-run --message-format=json > /tmp/build-image.json
      - name: Run the test binary as root
        run: |
          set -euo pipefail
          BIN=$(python3 -c '
          import json
          path = ""
          for line in open("/tmp/build-image.json"):
              event = json.loads(line)
              target = event.get("target") or {}
              if event.get("reason") == "compiler-artifact" and target.get("name") == "build_image" and event.get("executable"):
                  path = event["executable"]
          print(path)
          ')
          test -n "$BIN"
          sudo env PATH="$PATH" ROB_TEST_REGISTRY=localhost:5000 ROB_REQUIRE_BUILD=1 "$BIN" --nocapture --test-threads=1
      - name: Build and run oci-runner integration test as root
        run: |
          set -euo pipefail
          cargo build --locked -p oci-runner
          cargo test -p oci-runner --test run_container --locked --no-run --message-format=json > /tmp/run-container.json
          BIN=$(python3 -c '
          import json
          path = ""
          for line in open("/tmp/run-container.json"):
              event = json.loads(line)
              target = event.get("target") or {}
              if event.get("reason") == "compiler-artifact" and target.get("name") == "run_container" and event.get("executable"):
                  path = event["executable"]
          print(path)
          ')
          test -n "$BIN"
          sudo env PATH="$PATH" CARGO_BIN_EXE_oci_runner="$(pwd)/target/debug/oci-runner" CARGO_BIN_EXE_oci-runner="$(pwd)/target/debug/oci-runner" ROR_TEST_HOST_ROOT=1 "$BIN" --nocapture

  linux-rootless:
    name: rootless build and push
    runs-on: ubuntu-24.04
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000
    steps:
      - name: Allow unprivileged user namespaces
        run: |
          set -euo pipefail
          echo 'kernel.apparmor_restrict_unprivileged_userns=0' | sudo tee /etc/sysctl.d/99-userns.conf >/dev/null
          echo 'kernel.unprivileged_userns_clone=1' | sudo tee -a /etc/sysctl.d/99-userns.conf >/dev/null
          sudo sysctl --system
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: false
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-deps-${{ hashFiles('**/Cargo.lock', '**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-deps-
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc pkg-config libseccomp-dev uidmap fuse-overlayfs slirp4netns curl crun
      - name: Configure subordinate IDs
        run: |
          set -euo pipefail
          user=$(id -un)
          grep -q "^${user}:" /etc/subuid || echo "${user}:100000:65536" | sudo tee -a /etc/subuid >/dev/null
          grep -q "^${user}:" /etc/subgid || echo "${user}:100000:65536" | sudo tee -a /etc/subgid >/dev/null
      - name: Verify rootless user namespaces
        run: |
          set -euo pipefail
          test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = "0"
          unshare -Ur true
      - name: Wait for the registry
        run: |
          for _ in $(seq 1 30); do
            curl -sf http://localhost:5000/v2/ && exit 0
            sleep 1
          done
          echo "registry did not become ready" >&2
          exit 1
      - name: Build and run the integration test
        run: |
          set -euo pipefail
          cargo test -p oci-builder --test build_image --locked --no-run --message-format=json > /tmp/build-image.json
          BIN=$(python3 -c '
          import json
          path = ""
          for line in open("/tmp/build-image.json"):
              event = json.loads(line)
              target = event.get("target") or {}
              if event.get("reason") == "compiler-artifact" and target.get("name") == "build_image" and event.get("executable"):
                  path = event["executable"]
          print(path)
          ')
          test -n "$BIN"
          ROB_TEST_REGISTRY=localhost:5000 ROB_REQUIRE_BUILD=1 "$BIN" --nocapture --test-threads=1
