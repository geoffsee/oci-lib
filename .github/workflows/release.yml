# Trusted publishing. On crates.io, each crate's Settings → Trusted Publishing
# GitHub entry must use workflow filename release.yml and environment release.
# The first version of a crate still has to be uploaded with an API token.
# Later versions are published by pushing a vX.Y.Z tag that matches
# workspace.package.version. No long-lived token lives in GitHub secrets;
# rust-lang/crates-io-auth-action exchanges OIDC for a short-lived token
# passed to cargo publish as CARGO_REGISTRY_TOKEN (see crates.io docs).
name: Release

on:
  push:
    tags:
      - "v*"
  # Auto Tag pushes the tag with GITHUB_TOKEN, which does not fire push: tags.
  # Explicit workflow_dispatch trigger allows Auto Tag and maintainers to dispatch release workflows.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  publish:
    name: publish to crates.io
    needs: test
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: false
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y gcc pkg-config libseccomp-dev
      - name: Require the tag to match the crate versions
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" = "$GITHUB_REF_NAME" ]; then
            echo "ref ${GITHUB_REF_NAME} is not a v* tag" >&2
            exit 1
          fi
          python3 - "$tag" << 'PY'
          import json, subprocess, sys
          tag = sys.argv[1]
          meta = json.loads(subprocess.check_output([
              "cargo", "metadata", "--format-version", "1", "--no-deps", "--locked",
          ]))
          want = {"oci-builder", "oci-runner"}
          found = {pkg["name"]: pkg["version"] for pkg in meta["packages"] if pkg["name"] in want}
          missing = want - set(found)
          if missing:
              raise SystemExit(f"missing packages in metadata: {sorted(missing)}")
          for name, version in sorted(found.items()):
              if version != tag:
                  raise SystemExit(f"{name} is {version}, tag is v{tag}")
          print(f"tag v{tag} matches oci-builder and oci-runner")
          PY
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish oci-util
        run: bash .github/workflows/publish-crate.sh oci-util
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      - name: Publish oci-builder
        run: bash .github/workflows/publish-crate.sh oci-builder
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      - name: Publish oci-runner
        run: bash .github/workflows/publish-crate.sh oci-runner
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  linux-binaries:
    name: ${{ matrix.target }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            guest: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            guest: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: false
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ matrix.target }}-release-${{ hashFiles('**/Cargo.lock', '**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-release-
      - name: Install build tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gcc pkg-config libseccomp-dev
          if [ "${{ matrix.guest }}" = "true" ]; then
            sudo apt-get install -y musl-tools musl-dev linux-libc-dev make bzip2 cpio curl
            arch=$(uname -m)
            dest="/usr/include/${arch}-linux-musl"
            sudo mkdir -p "$dest"
            sudo ln -sfn /usr/include/linux "$dest/linux"
            sudo ln -sfn /usr/include/asm-generic "$dest/asm-generic"
            sudo ln -sfn /usr/include/mtd "$dest/mtd"
            if [ -d "/usr/include/${arch}-linux-gnu/asm" ]; then
              sudo ln -sfn "/usr/include/${arch}-linux-gnu/asm" "$dest/asm"
            fi
          fi
      - name: Build the release binaries
        run: |
          cargo build --release --locked -p oci-builder
          cargo build --release --locked -p oci-runner
      - name: Allow unprivileged user namespaces
        run: |
          set -euo pipefail
          echo 'kernel.apparmor_restrict_unprivileged_userns=0' | sudo tee /etc/sysctl.d/99-userns.conf >/dev/null
          echo 'kernel.unprivileged_userns_clone=1' | sudo tee -a /etc/sysctl.d/99-userns.conf >/dev/null
          sudo sysctl --system
      - name: Stage the binaries
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/release/oci-builder dist/oci-builder
          cp target/release/oci-runner dist/oci-runner
          chmod 755 dist/oci-builder dist/oci-runner
          ./dist/oci-builder --help >/dev/null
          ./dist/oci-runner --help >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/
      - name: Build the Apple Silicon guests
        if: matrix.guest
        run: |
          cargo xtask guest oci-builder oci-runner
      - uses: actions/upload-artifact@v4
        if: matrix.guest
        with:
          name: guest-aarch64-builder
          path: crates/oci-builder/guest/out/
      - uses: actions/upload-artifact@v4
        if: matrix.guest
        with:
          name: guest-aarch64-runner
          path: crates/oci-runner/guest/out/

  macos-binary:
    name: aarch64-apple-darwin
    needs: linux-binaries
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: macos-aarch64-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            macos-aarch64-release-
      - uses: actions/download-artifact@v4
        with:
          name: guest-aarch64-builder
          path: crates/oci-builder/guest/out
      - uses: actions/download-artifact@v4
        with:
          name: guest-aarch64-runner
          path: crates/oci-runner/guest/out
      - name: Embed the guests and build
        run: |
          cargo build --release --locked -p oci-builder
          cargo build --release --locked -p oci-runner
      - name: Check signatures and that guests were embedded
        run: |
          set -euo pipefail
          mkdir -p dist
          for bin_name in oci-builder oci-runner; do
            bin="target/release/$bin_name"
            codesign --verify --verbose=2 "$bin"
            codesign -d --entitlements - "$bin" | grep -q com.apple.security.virtualization
            size=$(wc -c < "$bin")
            test "$size" -gt 10000000
            "$bin" --help >/dev/null
            cp "$bin" "dist/$bin_name"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: aarch64-apple-darwin
          path: dist/

  github-release:
    name: publish binary archives
    needs: [publish, linux-binaries, macos-binary]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Package archives
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          case "$version" in
            v*) ;;
            *)
              echo "ref ${version} is not a v* tag" >&2
              exit 1
              ;;
          esac
          mkdir -p packages
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu aarch64-apple-darwin; do
            for pkg in oci-builder oci-runner; do
              stage=$(mktemp -d)
              cp "artifacts/${target}/${pkg}" "$stage/${pkg}"
              chmod 755 "$stage/${pkg}"
              tar -C "$stage" -czf "packages/${pkg}-${version}-${target}.tar.gz" "${pkg}"
              rm -rf "$stage"
            done
          done
          # macOS build.rs downloads these when guest/out is absent.
          # guest/out/ is uploaded whole, so attestation.json is already in the artifact.
          cp artifacts/guest-aarch64-builder/initramfs "packages/oci-builder-${version}-aarch64-initramfs"
          cp artifacts/guest-aarch64-runner/initramfs "packages/oci-runner-${version}-aarch64-initramfs"
          cp artifacts/guest-aarch64-builder/attestation.json "packages/oci-builder-${version}-aarch64-guest-attestation.json"
          cp artifacts/guest-aarch64-runner/attestation.json "packages/oci-runner-${version}-aarch64-guest-attestation.json"
          (cd packages && sha256sum ./*.tar.gz ./*-initramfs ./*-guest-attestation.json > SHA256SUMS)
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          # This job downloads artifacts and does not check out the repo, so
          # gh cannot discover the repository from a git remote.
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          notes=$(mktemp)
          {
            printf '%s\n' \
              "## Binaries" \
              "" \
              "Archives contain \`oci-builder\` and \`oci-runner\`. The Apple Silicon binaries embed the zstd-compressed Linux kernel and initramfs and write them to the cache directory on first use. The \`*-initramfs\` assets are what macOS builds from source download when \`guest/out\` is absent. The \`*-guest-attestation.json\` assets are the kernel, initramfs, and initramfs member hashes for that guest. Linux binaries are built on Ubuntu 24.04 and need that glibc plus \`libseccomp.so.2\`." \
              ""
            gh api --method POST \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f "tag_name=${tag}" --jq .body || true
          } > "$notes"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" packages/* --clobber
            gh release edit "$tag" --notes-file "$notes"
          else
            gh release create "$tag" --title "$tag" --notes-file "$notes" packages/*
          fi
