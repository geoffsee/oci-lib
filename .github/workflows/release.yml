# A tagged oci-lib release builds and publishes the CLI archives and their
# matching Linux guest artifacts. `oci-util` is an internal workspace crate;
# it is deliberately not a crates.io release target.
name: Release

on:
  push:
    tags:
      - "v*"
  # Auto Tag pushes the tag with GITHUB_TOKEN, which does not fire push: tags.
  # Explicit workflow_dispatch trigger allows Auto Tag and maintainers to dispatch release workflows.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  linux-binaries:
    name: ${{ matrix.target }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            guest: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            guest: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: false
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ matrix.target }}-release-${{ hashFiles('**/Cargo.lock', '**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-release-
      - name: Install build tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gcc pkg-config libseccomp-dev
          if [ "${{ matrix.guest }}" = "true" ]; then
            sudo apt-get install -y musl-tools musl-dev linux-libc-dev make bzip2 cpio curl ca-certificates
            arch=$(uname -m)
            dest="/usr/include/${arch}-linux-musl"
            sudo mkdir -p "$dest"
            sudo ln -sfn /usr/include/linux "$dest/linux"
            sudo ln -sfn /usr/include/asm-generic "$dest/asm-generic"
            sudo ln -sfn /usr/include/mtd "$dest/mtd"
            if [ -d "/usr/include/${arch}-linux-gnu/asm" ]; then
              sudo ln -sfn "/usr/include/${arch}-linux-gnu/asm" "$dest/asm"
            fi
          fi
      - name: Build the release binaries
        run: |
          cargo build --release --locked -p oci-builder
          cargo build --release --locked -p oci-runner
      - name: Allow unprivileged user namespaces
        run: |
          set -euo pipefail
          echo 'kernel.apparmor_restrict_unprivileged_userns=0' | sudo tee /etc/sysctl.d/99-userns.conf >/dev/null
          echo 'kernel.unprivileged_userns_clone=1' | sudo tee -a /etc/sysctl.d/99-userns.conf >/dev/null
          sudo sysctl --system
      - name: Stage the binaries
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/release/oci-builder dist/oci-builder
          cp target/release/oci-runner dist/oci-runner
          chmod 755 dist/oci-builder dist/oci-runner
          ./dist/oci-builder --help >/dev/null
          ./dist/oci-runner --help >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/
      - name: Build the Apple Silicon guests
        if: matrix.guest
        run: |
          cargo xtask guest oci-builder oci-runner
      - name: Validate guest compatibility metadata
        if: matrix.guest
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import gzip, hashlib, json, pathlib, subprocess

          expected_version = pathlib.Path("Cargo.toml").read_text().split('version = "', 1)[1].split('"', 1)[0]
          for package in ("oci-builder", "oci-runner"):
              root = pathlib.Path("crates") / package / "guest" / "out"
              document = json.loads((root / "attestation.json").read_text())
              if document.get("package") != package:
                  raise SystemExit(f"{package}: attestation package is {document.get('package')!r}")
              if document.get("package_version") != expected_version:
                  raise SystemExit(
                      f"{package}: attestation version is {document.get('package_version')!r}, expected {expected_version!r}"
                  )
              if document.get("protocol_version") != 2:
                  raise SystemExit(f"{package}: unsupported guest protocol {document.get('protocol_version')!r}")
              actual = hashlib.sha256((root / "vmlinuz").read_bytes()).hexdigest()
              if document.get("kernel_sha256") != actual:
                  raise SystemExit(f"{package}: kernel hash does not match attestation")
              actual = hashlib.sha256((root / "initramfs").read_bytes()).hexdigest()
              if document.get("initramfs_sha256") != actual:
                  raise SystemExit(f"{package}: initramfs hash does not match attestation")
              ca_path = "etc/ssl/certs/ca-certificates.crt"
              ca = next((m for m in document["members"] if m["path"] == ca_path), None)
              if ca is None or ca["size"] == 0:
                  raise SystemExit(f"{package}: missing CA trust bundle")
              bundle = subprocess.run(
                  ["cpio", "-i", "--to-stdout", "--quiet", ca_path],
                  input=gzip.decompress((root / "initramfs").read_bytes()),
                  stdout=subprocess.PIPE, check=True,
              ).stdout
              if len(bundle) != ca["size"] or hashlib.sha256(bundle).hexdigest() != ca["sha256"]:
                  raise SystemExit(f"{package}: CA bundle does not match attestation")
              if b"-----BEGIN CERTIFICATE-----" not in bundle:
                  raise SystemExit(f"{package}: CA bundle contains no PEM certificates")
          PY
      - uses: actions/upload-artifact@v4
        if: matrix.guest
        with:
          name: guest-aarch64-builder
          path: crates/oci-builder/guest/out/
      - uses: actions/upload-artifact@v4
        if: matrix.guest
        with:
          name: guest-aarch64-runner
          path: crates/oci-runner/guest/out/

  macos-binary:
    name: aarch64-apple-darwin
    needs: linux-binaries
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: macos-aarch64-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            macos-aarch64-release-
      - uses: actions/download-artifact@v4
        with:
          name: guest-aarch64-builder
          path: crates/oci-builder/guest/out
      - uses: actions/download-artifact@v4
        with:
          name: guest-aarch64-runner
          path: crates/oci-runner/guest/out
      - name: Embed the guests and build
        run: |
          cargo build --release --locked -p oci-builder
          cargo build --release --locked -p oci-runner
      - name: Check signatures and that guests were embedded
        run: |
          set -euo pipefail
          mkdir -p dist
          version="${GITHUB_REF_NAME#v}"
          for bin_name in oci-builder oci-runner; do
            bin="target/release/$bin_name"
            codesign --verify --verbose=2 "$bin"
            codesign -d --entitlements - "$bin" | grep -q com.apple.security.virtualization
            size=$(wc -c < "$bin")
            test "$size" -gt 10000000
            "$bin" --help >/dev/null
            cp "$bin" "dist/$bin_name"
          done
          for bin_name in oci-builder oci-runner; do
            report=$("target/release/$bin_name" diagnose 2>&1) || status=$?
            status=${status:-0}
            printf '%s\n' "$report"
            # GitHub's hosted macOS runner does not expose
            # Virtualization.framework. The command remains blocked there,
            # but its embedded guest/attestation report must still be valid.
            if [ "$status" -ne 0 ] && ! grep -q 'Virtualization.framework is not available' <<<"$report"; then
              echo "$bin_name diagnose failed" >&2
              exit "$status"
            fi
            grep -q "embedded guest package $bin_name $version" <<<"$report"
            grep -q 'embedded guest protocol version 2' <<<"$report"
            grep -q 'embedded guest kernel sha256' <<<"$report"
            grep -q 'embedded guest initramfs sha256' <<<"$report"
            unset status
          done
      - uses: actions/upload-artifact@v4
        with:
          name: aarch64-apple-darwin
          path: dist/

  github-release:
    name: publish binary archives
    needs: [test, linux-binaries, macos-binary]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Package archives
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          case "$version" in
            v*) ;;
            *)
              echo "ref ${version} is not a v* tag" >&2
              exit 1
              ;;
          esac
          mkdir -p packages
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu aarch64-apple-darwin; do
            for pkg in oci-builder oci-runner; do
              stage=$(mktemp -d)
              cp "artifacts/${target}/${pkg}" "$stage/${pkg}"
              chmod 755 "$stage/${pkg}"
              tar -C "$stage" -czf "packages/${pkg}-${version}-${target}.tar.gz" "${pkg}"
              rm -rf "$stage"
            done
          done
          # macOS build.rs downloads these when guest/out is absent.
          # guest/out/ is uploaded whole, so attestation.json is already in the artifact.
          cp artifacts/guest-aarch64-builder/initramfs "packages/oci-builder-${version}-aarch64-initramfs"
          cp artifacts/guest-aarch64-runner/initramfs "packages/oci-runner-${version}-aarch64-initramfs"
          cp artifacts/guest-aarch64-builder/attestation.json "packages/oci-builder-${version}-aarch64-guest-attestation.json"
          cp artifacts/guest-aarch64-runner/attestation.json "packages/oci-runner-${version}-aarch64-guest-attestation.json"
          (cd packages && sha256sum ./*.tar.gz ./*-initramfs ./*-guest-attestation.json > SHA256SUMS)
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          # This job downloads artifacts and does not check out the repo, so
          # gh cannot discover the repository from a git remote.
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          notes=$(mktemp)
          {
            printf '%s\n' \
              "## Binaries" \
              "" \
              "Archives contain \`oci-builder\` and \`oci-runner\`. The Apple Silicon binaries embed the zstd-compressed Linux kernel and initramfs and write them to the cache directory on first use. The \`*-initramfs\` assets are what macOS builds from source download when \`guest/out\` is absent. The \`*-guest-attestation.json\` assets are the kernel, initramfs, and initramfs member hashes for that guest. Linux binaries are built on Ubuntu 24.04 and need that glibc plus \`libseccomp.so.2\`." \
              ""
            gh api --method POST \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f "tag_name=${tag}" --jq .body || true
          } > "$notes"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" packages/* --clobber
            gh release edit "$tag" --notes-file "$notes"
          else
            gh release create "$tag" --title "$tag" --notes-file "$notes" packages/*
          fi
